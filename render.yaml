# Render "Blueprint": how Render builds and runs BreakRides.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: breakrides
    runtime: python            # Python version from .python-version (3.12)
    plan: free                 # sleeps after 15 min idle; first visit then takes ~1 min
    region: oregon             # closest region to California
    branch: main
    # Install the API, then build the React app into frontend/dist, which
    # FastAPI serves from the same server.
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    # Free instances can't use Render's pre-deploy step, so migrations run
    # just before the server starts (safe: there's only one instance).
    # The visitor's real IP is worked out in app/client_ip.py from the
    # proxy headers, skipping entries a visitor could have faked.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass  # only deploy commits whose CI passed
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SECURE_COOKIES        # https only in production
        value: "true"
      - key: ALLOWED_EMAIL_DOMAIN
        value: scu.edu
      - key: API_DOCS              # no public /docs page in production
        value: "false"
      - key: EMAIL_BACKEND
        value: smtp
      # Secrets: Render asks for these once in the dashboard. Never in git.
      - key: DATABASE_URL          # from Neon
        sync: false
      - key: EMAIL_FROM            # e.g. BreakRides <you@gmail.com>
        sync: false
      - key: SMTP_USERNAME         # the Gmail address
        sync: false
      - key: SMTP_PASSWORD         # a Gmail app password, not your real password
        sync: false
